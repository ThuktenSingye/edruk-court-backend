paths:
  "/api/v1/users/{user_id}/profile/addresses":
    parameters:
    - name: user_id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
    post:
      summary: Create Address
      tags:
      - Addresses
      security:
      - Bearer: []
      parameters: []
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  dzongkhag:
                    type: string
                  gewog:
                    type: string
                  street_address:
                    type: string
                  address_type:
                    type: string
        '422':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: object
                  properties:
                    dzongkhag:
                      type: string
                    gewog:
                      type: string
                    street_address:
                      type: string
                    address_type:
                      type: string
                  required:
                  - dzongkhag
                  - gewog
                  - street_address
                  - address_type
              required:
              - address
