      - Authentication
      parameters: []
      responses:
        '200':
          description: password successfully reset
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    reset_password_token:
                      type: string
                  required:
                  - email
                  - password
                  - password_confirmation
                  - reset_password_token
  "/api/v1/signup":
    post:
      summary: User registration
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: users created
          content:
            application/json:
              schema:
                type: object
