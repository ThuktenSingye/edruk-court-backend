  "/api/v1/auth/confirmation":
    get:
      summary: Confirm users account
      tags:
      - Authentication
      parameters:
      - name: confirmation_token
        in: query
        required: true
        description: Confirmation token sent to users email
        schema:
          type: string
      responses:
        '200':
          description: account successfully confirmed
        '422':
          description: unprocessable entity
  "/api/v1/auth/password":
    put:
      summary: Reset users password
