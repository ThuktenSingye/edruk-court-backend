                      last_name:
                        type: string
                      cid_no:
                        type: string
                      phone_number:
                        type: string
                      gender:
                        type: string
                    required:
                    - first_name
                    - last_name
                    - cid_no
                    - phone_number
                    - gender
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    profile_attributes:
                      type: object
