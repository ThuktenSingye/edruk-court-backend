          description: Case updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  case_number:
                    type: string
                  registration_number:
                    type: string
                  judgement_number:
                    type: string
                  title:
                    type: string
                  summary:
                    type: string
                  case_priority:
                    type: string
                  case_status:
                    type: string
                  case_subtype:
                    type: integer
                  court:
                    type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                case_number:
                  type: string
                registration_number:
                  type: string
                judgement_number:
                  type: string
                title:
                  type: string
                summary:
                  type: string
                case_priority:
                  type: string
                case_status:
                  type: string
  "/api/v1/cases/statistics":
    get:
      summary: Get case statistics
      tags:
      - Cases
      security:
      - Bearer: []
      responses:
        '401':
          description: Unauthorized
        '200':
          description: Statistics found
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  civil:
                    type: integer
                  criminal:
                    type: integer
                  others:
                    type: integer
