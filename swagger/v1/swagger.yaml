---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/users/{user_id}/profile/addresses":
    parameters:
    - name: user_id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
    post:
      summary: Create Address
      tags:
      - Addresses
      security:
      - Bearer: []
      parameters: []
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  dzongkhag:
                    type: string
                  gewog:
                    type: string
                  street_address:
                    type: string
                  address_type:
                    type: string
        '422':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: object
                  properties:
                    dzongkhag:
                      type: string
                    gewog:
                      type: string
                    street_address:
                      type: string
                    address_type:
                      type: string
                  required:
                  - dzongkhag
                  - gewog
                  - street_address
                  - address_type
              required:
              - address
  "/api/v1/auth/confirmation":
    get:
      summary: Confirm user account
      tags:
      - Authentication
      parameters:
      - name: confirmation_token
        in: query
        required: true
        description: Confirmation token sent to user email
        schema:
          type: string
      responses:
        '200':
          description: account successfully confirmed
        '422':
          description: unprocessable entity
  "/api/v1/auth/password":
    put:
      summary: Reset user password
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: password successfully reset
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    reset_password_token:
                      type: string
                  required:
                  - email
                  - password
                  - password_confirmation
                  - reset_password_token
  "/api/v1/signup":
    post:
      summary: User registration
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                  profile_attributes:
                    type: object
                    properties:
                      first_name:
                        type: string
                      last_name:
                        type: string
                      cid_no:
                        type: string
                      phone_number:
                        type: string
                      gender:
                        type: string
                    required:
                    - first_name
                    - last_name
                    - cid_no
                    - phone_number
                    - gender
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    profile_attributes:
                      type: object
                      properties:
                        first_name:
                          type: string
                        last_name:
                          type: string
                        cid_no:
                          type: string
                        phone_number:
                          type: string
                        gender:
                          type: string
                      required:
                      - first_name
                      - last_name
                      - cid_no
                      - phone_number
                      - gender
                  required:
                  - email
                  - password
                  - password_confirmation
                  - profile_attributes
  "/api/v1/signin":
    post:
      summary: User login
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                  required:
                  - email
                  - password
  "/api/v1/cases":
    get:
      summary: List all cases
      tags:
      - Cases
      security:
      - Bearer: []
      responses:
        '200':
          description: Cases found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    case_number:
                      type: string
                    registration_number:
                      type: string
                    judgement_number:
                      type: string
                    title:
                      type: string
                    summary:
                      type: string
                    case_priority:
                      type: string
                    case_status:
                      type: string
                    case_subtype:
                      type: integer
                    court:
                      type: integer
    post:
      summary: Create a case
      tags:
      - Cases
      security:
      - Bearer: []
      parameters: []
      responses:
        '401':
          description: Unauthorized
        '201':
          description: Case created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  case_number:
                    type: string
                  registration_number:
                    type: string
                  judgement_number:
                    type: string
                  title:
                    type: string
                  summary:
                    type: string
                  case_priority:
                    type: string
                  case_status:
                    type: string
                  case_subtype:
                    type: integer
                  court:
                    type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                case_number:
                  type: string
                registration_number:
                  type: string
                judgement_number:
                  type: string
                title:
                  type: string
                summary:
                  type: string
                case_priority:
                  type: string
                case_status:
                  type: string
                case_subtype:
                  type: integer
                court:
