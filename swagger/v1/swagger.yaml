  "/api/v1/cases/:case_id/hearings/:hearing_id/documents":
    get:
      summary: List all case documents for a given hearing
      tags:
      - Case Documents
      security:
      - Bearer: []
      parameters:
      - name: case_id
        in: path
        description: Case ID
        required: true
        schema:
          type: integer
      - name: hearing_id
        in: path
        description: Hearing ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Case Documents found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    hearing_id:
                      type: integer
                    verified_by_judge:
                      type: boolean
                    verified_at:
                      type: string
                      format: date-time
                    document_status:
                      type: string
                    document:
                      type: object
                      properties:
                        url:
                          type: string
                        filename:
                          type: string
                        content_type:
                          type: string
                        byte_size:
                          type: integer
                  required:
                  - hearing_id
                  - document_status
                  - document
    post:
      summary: Create new case documents record for a given hearing
      tags:
      - Case Documents
      security:
      - Bearer: []
      parameters:
      - name: case_id
        in: path
        description: Case ID
        required: true
        schema:
          type: integer
      - name: hearing_id
        in: path
        description: Hearing ID
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Case Documents Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  hearing_id:
                    type: integer
                  verified_by_judge:
                    type: boolean
                  verified_at:
                    type: string
                    format: date-time
                  document_status:
                    type: string
                  document:
                    type: object
                    properties:
                      url:
                        type: string
                      filename:
                        type: string
                      content_type:
                        type: string
                      byte_size:
                        type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_status:
                  type: string
                document:
                  type: string
                  format: binary
                  description: Document file to upload
              required:
              - document
  "/api/v1/cases/:case_id/hearings/:hearing_id/documents/:id":
    put:
